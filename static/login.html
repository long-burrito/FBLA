<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Downtown Donuts</title>
    <link rel="stylesheet" href="/static/login.css" media="screen">
    <script src="/static/home.js"></script>
</head>
<body>
    <div class="topimg">
        <img src="/static/donuts.jpg">
        <div class="imgcaption">
            Delicious Downtown Donuts
        </div>
    </div>
    <div class="tab">
        <div id = "Home" class = "active" onclick = "homeLink()">
            <p>Home</p>
        </div>
        <div id = "Benefits" class = "right-align" onclick = "benefitLink()">
            <p>Benefits</p>
        </div>
        <div id = "Apply" class = "right-align" onclick = "applyLink()">
            <p>Apply Now!</p>
        </div>
        <div id = "Login" class = "Login">
            <p>Employee Login</p>
        </div>
    </div>

    <div class="intro">
    <h1>Login Page</h1>
    <form action="/process_form" method="POST">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br>
    <input type="submit" value="Submit">
    </form>
</body>
</html>
